---
name: GitHub CI for 1.0.2

on: [pull_request, push]

permissions:
  contents: read

jobs:
  check_update:
    runs-on: ubuntu-22.04-self-hosted
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: config
      run: ./config --strict-warnings
    - name: make update
      run: make update
    - name: git diff
      run: git diff --exit-code

  # This checks that we use ANSI C language syntax and semantics.
  # We are not as strict with libraries, but rather adapt to what's
  # expected to be available in a certain version of each platform.
  check-ansi:
    runs-on: ubuntu-22.04-self-hosted
    steps:
    - uses: actions/checkout@v4
    - name: config
      run: CPPFLAGS=-ansi ./config no-asm enable-buildtest-c++ --strict-warnings
    - name: make depend
      run: make depend
    - name: make
      run: make

  basic_gcc:
    runs-on: ubuntu-22.04-self-hosted
    steps:
    - uses: actions/checkout@v4
    - name: config
      run: CC=gcc ./config --strict-warnings
    - name: make
      run: make
    - name: make test
      run: make test

  basic_clang:
    runs-on: ubuntu-22.04-self-hosted
    steps:
    - uses: actions/checkout@v4
    - name: config
      run: CC=clang ./config --strict-warnings
    - name: make
      run: make
    - name: make test
      run: make test

  minimal:
    runs-on: ubuntu-22.04-self-hosted
    steps:
    - uses: actions/checkout@v4
    - name: config
      run: ./config no-shared no-dso no-pic no-bf no-camellia no-cast no-cmac no-cms no-comp no-des no-dh no-dtls no-ec2m no-engine no-filenames no-gost no-idea no-mdc2 no-md4 no-multiblock no-nextprotoneg no-psk no-rc2 no-rc4 no-rmd160 no-siphash no-srp no-srtp no-ssl3 no-ssl3-method no-whirlpool no-asm -DOPENSSL_NO_SECURE_MEMORY -DOPENSSL_SMALL_FOOTPRINT
    - name: make update
      run: make update
    - name: make depend
      run: make depend
    - name: make
      run: make       # verbose, so no -s here
    - name: make test
      run: make test

  no-deprecated:
    runs-on: ubuntu-22.04-self-hosted
    steps:
    - uses: actions/checkout@v4
    - name: config
      run: ./config --strict-warnings no-deprecated
    - name: make depend
      run: make depend
    - name: make
      run: make
    - name: make test
      run: make test

  no-shared:
    runs-on: ubuntu-22.04-self-hosted
    steps:
    - uses: actions/checkout@v4
    - name: config
      run: ./config --strict-warnings no-shared
    - name: make depend
      run: make depend
    - name: make
      run: make
    - name: make test
      run: make test

  address_ub_sanitizer:
    runs-on: ubuntu-22.04-self-hosted
    steps:
    - uses: actions/checkout@v4
    - name: config
      run: ./config --debug enable-asan enable-ubsan enable-rc5 enable-md2 enable-ec_nistp_64_gcc_128
    - name: make depend
      run: make depend
    - name: make
      run: make
    - name: make test
      run: make test OPENSSL_TEST_RAND_ORDER=0

  enable_non-default_options:
    runs-on: ubuntu-22.04-self-hosted
    steps:
    - uses: actions/checkout@v4
    - name: config
      run: ./config --strict-warnings enable-ssl-trace enable-zlib enable-zlib-dynamic enable-crypto-mdebug enable-crypto-mdebug-backtrace enable-egd
    - name: make update
      run: make update
    - name: make depend
      run: make depend
    - name: make
      run: make
    - name: make test
      run: make test

  legacy:
    runs-on: ubuntu-22.04-self-hosted
    steps:
    - uses: actions/checkout@v4
    - name: config
      run: ./config -Werror --debug no-shared enable-crypto-mdebug enable-rc5 enable-md2 enable-ssl3 enable-ssl3-method enable-weak-ssl-ciphers enable-zlib enable-ec_nistp_64_gcc_128
    - name: make update
      run: make update
    - name: make depend
      run: make depend
    - name: make
      run: make
    - name: make test
      run: make test

  buildtest:
    runs-on: ubuntu-22.04-self-hosted
    steps:
    - uses: actions/checkout@v4
    - name: config
      run: ./config no-asm no-makedepend enable-buildtest-c++ --strict-warnings
    - name: make depend
      run: make depend
    - name: make
      run: make
    - name: make test
      run: make test

  installtest:
    runs-on: ubuntu-22.04-self-hosted
    steps:
    - uses: actions/checkout@v4
    - name: extra preparations
      run: |
        mkdir ./install_dir
    - name: config
      run: ./Configure linux-x86_64 --strict-warnings --prefix=$(cd install_dir; pwd)
    - name: make depend
      run: make depend
    - name: make
      run: make
    - name: make test
      run: make test
    - name: make install
      run: make install

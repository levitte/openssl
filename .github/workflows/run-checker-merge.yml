---
name: Run-checker merge for 1.0.2
# Jobs run per merge to 1.0.2

on: [push]
permissions:
  contents: read

jobs:
  run-checker:
    strategy:
      fail-fast: false
      matrix:
        opt: [
          386,
#         no-shared no-asm -DOPENSSL_SMALL_FOOTPRINT,
          enable-crypto-mdebug-backtrace,
          enable-crypto-mdebug,
          enable-ec_nistp_64_gcc_128,
          enable-egd,
          enable-heartbeats,
          enable-md2,
          enable-rc5,
#         no-asm -DPEDANTIC -DOPENSSL_SMALL_FOOTPRINT -fno-sanitize=alignment,
          enable-unit-test,
          enable-weak-ssl-ciphers,
          enable-zlib-dynamic,
          enable-zlib,
          no-afalgeng,
          no-asm,
          no-async,
          no-autoalginit,
          no-autoerrinit,
          no-autoload-config,
          no-bf,
          no-camellia,
          no-capieng,
          no-cast,
          no-cmac,
          no-comp,
          no-crypto-mdebug-backtrace,
          no-crypto-mdebug,
          no-deprecated,
#          no-des,
          no-devcryptoeng,
#          no-dgram,
#          no-dh,
#          no-dsa,
          no-dso,
          no-dtls1_2-method,
          no-dtls1_2,
          no-dtls1-method,
          no-dtls1,
          no-dynamic-engine,
          no-ec_nistp_64_gcc_128,
#          no-ecdh,
#          no-ecdsa,
          no-egd,
          no-engine no-shared,
          no-engine,
#          no-err,
          no-external-tests,
          no-filenames,
          no-gost,
          no-heartbeats,
          no-hw-padlock,
          no-hw,
          no-idea,
          no-makedepend,
          no-md2,
          no-md4,
          no-mdc2,
          no-msan,
          no-multiblock,
          no-nextprotoneg,
#          no-ocsp,
          no-pic,
#          no-posix-io,
          no-psk,
#          no-rc2,
#          no-rc4,
          no-rc5,
          no-rdrand,
          no-rfc3779,
          no-ripemd,
          no-rmd160,
          no-scrypt,
          no-sctp,
#          no-seed,
          no-shared,
          no-sse2,
          no-ssl-trace,
          no-ssl,
          no-ssl3-method,
          no-ssl3,
          no-static-engine no-shared,
#          no-stdio,
          no-tls1_1-method,
          no-tls1_1,
          no-tls1_2-method,
          no-tls1_2,
          no-tls1-method,
          no-tls1,
          no-ui-console,
          no-unit-test,
          no-weak-ssl-ciphers,
          no-whirlpool,
          no-zlib-dynamic,
          no-zlib
        ]
    runs-on: ubuntu-22.04-self-hosted
    steps:
    - uses: actions/checkout@v4
    - name: config
      run: CC=gcc ./config --strict-warnings ${{ matrix.opt }}
    - name: make update
      run: make update
    - name: make depend
      run: make depend
    - name: make
      run: make
    - name: make test
      run: make test
